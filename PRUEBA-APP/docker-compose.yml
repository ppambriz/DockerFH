version: '3.0'

services:
  db:
    container_name: prueba_db
    image: mongo:6.0
    volumes:
      - prueba-vol:/data/db
    ports:
      - 27017:27017
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: example


volumes:
  prueba-vol:
    external: false